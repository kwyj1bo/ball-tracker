[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balltracker"
version = "0.1.0"
description = "Track a cricket ball in single-camera video and predict its path with a fitted physics model."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pratik Lande" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
balltracker = "balltracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/balltracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
